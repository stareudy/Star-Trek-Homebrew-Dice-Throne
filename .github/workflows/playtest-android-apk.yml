name: Playtest Android APK (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playtest-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install and build web app
        run: |
          npm install
          npm run build
      - name: Generate and synchronize Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Set Janeway combadge app icon
        run: npm run generate-icons -- android
      - name: Build unsigned-for-distribution debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dice-throne-android-debug-apk
          path: playtest-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
