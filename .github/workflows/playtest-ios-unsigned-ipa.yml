name: Playtest iOS unsigned IPA (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: playtest-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies and build
        run: |
          npm install
          npm run build
      - name: Generate iOS project and install pods
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Enable universal iPhone and iPad with portrait and landscape
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          import subprocess
          project=Path('ios/App/App.xcodeproj/project.pbxproj')
          s=project.read_text()
          s=s.replace('TARGETED_DEVICE_FAMILY = "1,2";','TARGETED_DEVICE_FAMILY = "1,2";')
          s=s.replace('TARGETED_DEVICE_FAMILY = "1";','TARGETED_DEVICE_FAMILY = "1,2";')
          project.write_text(s)
          path=Path('ios/App/App/Info.plist')
          with path.open('rb') as f: data=plistlib.load(f)
          orientations=['UIInterfaceOrientationPortrait','UIInterfaceOrientationLandscapeLeft','UIInterfaceOrientationLandscapeRight','UIInterfaceOrientationPortraitUpsideDown']
          data['UISupportedInterfaceOrientations']=orientations[:3]
          data['UISupportedInterfaceOrientations~ipad']=orientations
          data['UIDeviceFamily']=[1,2]
          with path.open('wb') as f: plistlib.dump(data,f)
          PY
      - name: Set Janeway combadge app icon
        run: npm run generate-icons -- ios
      - name: Compile iOS application without signing
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for third-party signing
        run: |
          APP=$(find ios-derived-data/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"
          mkdir -p ipa-package/Payload
          cp -R "$APP" ipa-package/Payload/
          (cd ipa-package && zip -qry ../StarTrekDiceThrone-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: dice-throne-ios-unsigned-ipa
          path: playtest-app/StarTrekDiceThrone-unsigned.ipa
          if-no-files-found: error
