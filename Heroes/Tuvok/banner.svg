<text x="750" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" letter-spacing="4" fill="url(#gold)" filter="url(#shadow)">LT CMDR</text>
<text x="750" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" letter-spacing="4" fill="url(#name)" stroke="#7e4a10" stroke-width="1.5" paint-order="stroke" filter="url(#shadow)">TUVOK</text>
<text x="750" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="59" font-weight="400" font-style="italic" letter-spacing=".3" fill="#f2f5fb" filter="url(#shadow)">“Your defeat is the logical outcome”</text>
</svg>
