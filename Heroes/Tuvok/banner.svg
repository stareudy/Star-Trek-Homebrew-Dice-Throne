<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="439" viewBox="0 0 1500 439">
<title>Tuvok banner</title>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff8c8"/><stop offset=".18" stop-color="#f8dd78"/><stop offset=".43" stop-color="#fff4b0"/><stop offset=".62" stop-color="#e7a52c"/><stop offset=".82" stop-color="#ffcf50"/><stop offset="1" stop-color="#9d5c12"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10284d"/><stop offset=".16" stop-color="#20a9ff"/><stop offset=".35" stop-color="#164b89"/><stop offset=".5" stop-color="#d8f5ff"/><stop offset=".67" stop-color="#1e67b1"/><stop offset=".84" stop-color="#24a9ff"/><stop offset="1" stop-color="#10284d"/></linearGradient>
 <linearGradient id="divider" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1500" y2="0"><stop stop-color="#f3a62f"/><stop offset=".18" stop-color="#4ba8ff"/><stop offset=".42" stop-color="#f7bb3b"/><stop offset=".52" stop-color="#fff6b8"/><stop offset=".62" stop-color="#f4b33b"/><stop offset=".82" stop-color="#3e9eff"/><stop offset="1" stop-color="#eaaa35"/></linearGradient>
