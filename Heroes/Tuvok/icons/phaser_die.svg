<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 344" width="344" height="344" role="img" aria-label="Tuvok Phaser die-face blank draft" overflow="visible"><defs id="approved-reusable-die-lighting"><linearGradient id="reusable-die-sheen" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.02"/><stop offset="1" stop-color="#101018" stop-opacity="0.24"/></linearGradient><linearGradient id="reusable-defense-green" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#BAFFD7"/><stop offset="0.35" stop-color="#6AF2A8"/><stop offset="0.72" stop-color="#359963"/><stop offset="1" stop-color="#236D45"/></linearGradient><linearGradient id="reusable-straight-gold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#FFF0C6"/><stop offset="0.35" stop-color="#FFD27A"/><stop offset="1" stop-color="#97703B"/></linearGradient><filter id="reusable-dice-shared-shadow" x="-0.5" y="-1" width="2" height="3" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="36" result="expanded"/><feGaussianBlur in="expanded" stdDeviation="28" result="soft"/><feFlood flood-color="#000000" flood-opacity="0.8" result="black"/><feComposite in="black" in2="soft" operator="in" result="halo"/><feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g id="approved-reusable-die-surface" filter="url(#reusable-dice-shared-shadow)">
