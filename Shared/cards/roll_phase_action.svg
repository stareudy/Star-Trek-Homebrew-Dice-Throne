<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2.25in" height="3.5in" viewBox="0 0 675 1050"><defs id="action-readability-filters"><filter id="action-rules-halo" x="-100" y="540" width="875" height="610" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="4.5" result="expanded"/><feGaussianBlur in="expanded" stdDeviation="3.8" result="soft"/><feFlood flood-color="#000000" flood-opacity="0.8" result="black"/><feComposite in="black" in2="soft" operator="in" result="halo"/><feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <title>Roll Phase Action card template — editable pilot</title>
  <desc>Blank editable card template. For each activation die, match the face size and row spacing to that die in the original hero-board power; keep inline rules icons at the defined inline sizes.</desc>
  <defs id="rules-layout-defaults">
    <style type="text/css">
      .rules-text { font-family: "Avenir Next Condensed"; font-size: 45.833333px; font-weight: 400; fill: #F7F7F7; }
      .die-face-icon { width: 50px; height: 50px; }
      .inline-die-icon { width: auto; height: 50px; }
      .inline-damage-icon, .inline-token-icon { width: auto; height: 55px; }
    </style>
  </defs>
  <g id="rules-content-guide" aria-label="Default sizing for future editable rules content" data-rules-font="Avenir Next Condensed" data-rules-font-size="45.833333px" data-inline-die-icon-height="50" data-inline-damage-token-icon-height="55" data-rule-row-baseline-step="70" data-rules-text-alignment="center" data-activation-die-sizing="match-source-power-per-face" data-activation-die-row-spacing="match-source-power" data-inline-die-face-height="50" />

  <g id="outer-black-card" aria-label="Black outer card silhouette">
    <rect x="0" y="0" width="675" height="1050" rx="54" fill="#000000" />
  </g>
  <g id="dark-panels" aria-label="Dark content panels">
    <path id="upper-panel" d="M31 159 H644 V635 H31 Z" fill="#101219" />
