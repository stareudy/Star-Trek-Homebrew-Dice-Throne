<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2.25in" height="3.5in" viewBox="0 0 675 1050">
  <title>Not This Time! — editable SVG card</title>
  <desc>Editable vector card layout. Artwork and inline symbols are linked raster assets; title and rules are editable SVG text. Raster icon instances replaced with embedded SVG vector shapes; original text preserved.</desc>
  <defs id="rules-layout-defaults">
