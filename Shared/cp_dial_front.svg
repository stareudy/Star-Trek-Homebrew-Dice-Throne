<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="57mm" height="57mm" viewBox="0 0 498 498">
  <title>cp dial front</title>
  <desc>Editable sticker-front template. User-approved size: 57 by 57 mm. Openings and outside areas are transparent. Blank gray background is an editable placeholder for artwork. No number wheels or fastener caps. Opening contours approximate the reference print kit; health outer corner rounding follows the assembled scan.</desc>
  <defs>
    <clipPath id="front-clip"><path d="M 197,5.49 A 249,249 0 1 0 296,4.48 L 299,35 C 301,52 299,71 296,83 C 290,106 274,119 247,119 C 220,119 205,105 200,85 C 196,69 196,52 195,37 C 193,25 194,13 197,5.49 Z" clip-rule="evenodd"/></clipPath>
    <filter id="icon-aura" x="-65%" y="-65%" width="230%" height="230%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4.37" result="expanded-silhouette"/>
      <feGaussianBlur in="expanded-silhouette" stdDeviation="6.55" result="soft-silhouette"/>
      <feFlood flood-color="#000000" flood-opacity="0.8" result="halo-color"/>
      <feComposite in="halo-color" in2="soft-silhouette" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="background" inkscape:groupmode="layer" inkscape:label="Blank background">
    <path id="front-shape" d="M 197,5.49 A 249,249 0 1 0 296,4.48 L 299,35 C 301,52 299,71 296,83 C 290,106 274,119 247,119 C 220,119 205,105 200,85 C 196,69 196,52 195,37 C 193,25 194,13 197,5.49 Z" fill="#bcbcbc" fill-rule="evenodd"/>
  </g>
  <g id="artwork" inkscape:groupmode="layer" inkscape:label="Add artwork here" clip-path="url(#front-clip)"/>
  <g id="labels" inkscape:groupmode="layer" inkscape:label="Editable labels" clip-path="url(#front-clip)" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-weight="800" fill="#ffffff" stroke="#222222" stroke-width="1.4" paint-order="stroke fill" stroke-linejoin="round">
    <g id="cp-badge-aura" filter="url(#icon-aura)"><g id="cp-badge" data-source="icons/cp.svg" transform="translate(200 370.7171213) scale(0.12158809)" stroke="none" paint-order="normal"><path xmlns="http://www.w3.org/2000/svg" id="dial-cp-cp-badge" fill="#015768" stroke="#80C7D5" stroke-width="96.5" stroke-linejoin="round" paint-order="stroke fill" d="M170 0 H194 L750 318 C786 339 806 381 806 430 C806 479 786 521 750 542 L194 860 H170 C76 860 0 784 0 690 V170 C0 76 76 0 170 0 Z" />
  <text xmlns="http://www.w3.org/2000/svg" id="dial-cp-editable-cp-label" data-editable="label" x="350" y="536.75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="280" font-weight="700" fill="#B5E0E6">CP</text>
</g></g>
  </g>
  <g id="cut-lines" inkscape:groupmode="layer" inkscape:label="Cut contours" fill="none" stroke="#000000" stroke-width="1.2" stroke-linejoin="round">
    <path id="cut-contour" d="M 197,5.49 A 249,249 0 1 0 296,4.48 L 299,35 C 301,52 299,71 296,83 C 290,106 274,119 247,119 C 220,119 205,105 200,85 C 196,69 196,52 195,37 C 193,25 194,13 197,5.49 Z"/>
  </g>
</svg>
