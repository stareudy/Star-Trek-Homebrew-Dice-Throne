<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 344" width="344" height="344" role="img" aria-label="Coffee cup with rising steam on a dark blue circular token">
  <title>Coffee token</title>
  <desc>Vector coffee cup and steam on a full-bleed dark blue circular background.</desc>
  <defs>
    <clipPath id="face-clip">
      <circle cx="172" cy="172" r="172" />
    </clipPath>
  </defs>
  <g clip-path="url(#face-clip)">
    <rect width="344" height="344" fill="#907B57" />

    <g transform="translate(0 3.7) translate(172 172) scale(0.9986 0.8694) translate(-172 -172)">
    <g fill="#7A848B" transform="translate(0 -28)">
      <!-- Steam ribbons -->

      <g transform="translate(16.5 -35.175) scale(0.9 1.15)">
      <!-- Handle sits behind the cup body -->
      <g transform="translate(330 0) scale(-1 1)" fill="#111111">
        <path d="M121 176 L88 176 C67 176 50 188 50 207 L50 256 C50 275 67 287 88 287 L121 287 L121 268 L91 268 C82 268 76 263 76 255 L76 208 C76 200 82 195 91 195 L121 195 Z" />
      </g>

      <!-- Cup body -->
      <path d="M101 168 L101 294 C101 309 123 315 165 315 C207 315 229 309 229 294 L229 168 C217 176 192 181 165 181 C138 181 113 176 101 168 Z" />

      <!-- Raised rim -->
      <path d="M100 169 C100 160 129 154 165 154 C201 154 230 160 230 169 C230 178 201 184 165 184 C129 184 100 178 100 169 Z" />
      <path d="M101 168 L101 294 C101 309 123 315 165 315 C207 315 229 309 229 294 L229 168" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M100 169 C100 160 129 154 165 154 C201 154 230 160 230 169" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <g transform="translate(16.5 -63.175) scale(0.9 1.15)">
    <!-- Opaque face-color cutout gives the handle a clean, rounded opening. -->

    <!-- The cup opening is filled with the face color, never transparency. -->
    <path d="M109 169 C109 164 134 160 165 160 C196 160 221 164 221 169 C221 174 196 178 165 178 C134 178 109 174 109 169 Z" fill="#3B271C" />
    </g>
    <g fill="#D8C7A8">
      <path d="M151 75 C162 84 171 97 169 109 C167 122 157 132 149 143 C141 154 143 164 152 173 C138 168 131 156 137 143 C142 131 153 121 158 110 C164 97 159 85 151 75 Z" transform="translate(0 -41.825)" />
      <path d="M181 99 C192 108 196 119 192 131 C188 142 180 151 179 161 C178 168 181 174 188 179 C176 176 168 167 169 156 C170 143 180 132 183 121 C185 113 183 105 181 99 Z" transform="translate(0 -47.825)" />
    </g>
    </g>
    <circle cx="172" cy="172" r="165.7" fill="none" stroke="#777777" stroke-width="12.6" />
  </g>
</svg>
