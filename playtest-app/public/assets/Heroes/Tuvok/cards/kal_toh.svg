<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2.25in" height="3.5in" viewBox="0 0 675 1050">
  <title>KAL-TOH — Tuvok action card draft</title>
  <desc>Approved Kal-Toh card art. Rules are editable vector text and linked icons.</desc>
  <defs id="rules-layout-defaults">
    <style type="text/css">
      .rules-text { font-family: "Arial Narrow"; font-size: 45.833333px; font-weight: 400; fill: #F7F7F7; }
      .die-face-icon { width: 50px; height: 50px; }
      .inline-die-icon { width: auto; height: 50px; }
      .inline-damage-icon, .inline-token-icon { width: auto; height: 55px; }
    </style>
  </defs>
  <g id="rules-content-guide" aria-label="Default sizing for future editable rules content" data-rules-font="Arial Narrow" data-rules-font-size="36px" data-inline-die-icon-height="50" data-inline-damage-token-icon-height="55" data-rule-row-baseline-step="70" data-rules-text-alignment="center" data-activation-die-sizing="match-source-power-per-face" data-activation-die-row-spacing="match-source-power" data-inline-die-face-height="50" data-inline-icon-height="36" />

  <g id="outer-black-card" aria-label="Black outer card silhouette">
    <rect x="0" y="0" width="675" height="1050" rx="54" fill="#000000" />
  </g>
  <g id="dark-panels" aria-label="Dark content panels">
    <path id="upper-panel" d="M31 159 H644 V635 H31 Z" fill="#101219" />
    <path id="lower-panel" d="M31 643 H644 V970 C644 998 622 1020 594 1020 H81 C53 1020 31 998 31 970 Z" fill="#101219" /><defs id="action-readability-filters"><filter id="action-rules-halo" x="-100" y="540" width="875" height="610" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="4.5" result="expanded"/><feGaussianBlur in="expanded" stdDeviation="3.8" result="soft"/><feFlood flood-color="#000000" flood-opacity="0.8" result="black"/><feComposite in="black" in2="soft" operator="in" result="halo"/><feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="action-rules-background-clip" clipPathUnits="userSpaceOnUse"><path d="M31 643 H644 V970 C644 998 622 1020 594 1020 H81 C53 1020 31 998 31 970 Z"/></clipPath></defs><rect x="31" y="643" width="613" height="377" fill="#000"  clip-path="url(#action-rules-background-clip)"/>
  </g>
  <g id="card-art" aria-label="Approved Kal-Toh illustration">
    <rect x="31" y="159" width="613" height="476" fill="#000"  />
  </g>
  <g id="accent-elements" aria-label="Change this group color to recolor the template" fill="#507EBC" stroke="#507EBC"><defs id="surface-study-definitions"><linearGradient id="surface-study-continuous-light" gradientUnits="userSpaceOnUse" x1="0" y1="22" x2="0" y2="1027"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/><stop offset="0.065" stop-color="#FFFFFF" stop-opacity="0.08"/><stop offset="0.1353233831" stop-color="#16151B" stop-opacity="0.23"/><stop offset="0.23" stop-color="#16151B" stop-opacity="0.02"/><stop offset="0.8" stop-color="#16151B" stop-opacity="0.03"/><stop offset="1" stop-color="#16151B" stop-opacity="0.16"/></linearGradient>
<linearGradient id="surface-study-header" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/><stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.08"/><stop offset="1" stop-color="#16151B" stop-opacity="0.23"/></linearGradient>
<linearGradient id="surface-study-frame" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#101018" stop-opacity="0.12"/></linearGradient>
<filter id="surface-study-bevel" x="-0.1" y="-0.1" width="1.2" height="1.2" color-interpolation-filters="sRGB">
<feOffset in="SourceAlpha" dx="2.6" dy="2.6" result="insetFromLight"/>
<feComposite in="SourceAlpha" in2="insetFromLight" operator="out" result="litEdge"/>
<feGaussianBlur in="litEdge" stdDeviation="0.85" result="softLitEdge"/>
<feComposite in="softLitEdge" in2="SourceAlpha" operator="in" result="clippedLitEdge"/>
<feFlood flood-color="#FFFFFF" flood-opacity="0.64" result="lightColor"/>
<feComposite in="lightColor" in2="clippedLitEdge" operator="in" result="highlight"/>
<feOffset in="SourceAlpha" dx="-2.6" dy="-2.6" result="insetFromShade"/>
<feComposite in="SourceAlpha" in2="insetFromShade" operator="out" result="darkEdge"/>
<feGaussianBlur in="darkEdge" stdDeviation="0.95" result="softDarkEdge"/>
<feComposite in="softDarkEdge" in2="SourceAlpha" operator="in" result="clippedDarkEdge"/>
<feFlood flood-color="#11101A" flood-opacity="0.53" result="shadeColor"/>
<feComposite in="shadeColor" in2="clippedDarkEdge" operator="in" result="shade"/>
<feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="highlight"/><feMergeNode in="shade"/></feMerge>
</filter><linearGradient id="card-face-sheen" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.02"/><stop offset="1" stop-color="#101018" stop-opacity="0.24"/></linearGradient></defs><g id="surface-study-continuous-panel" filter="url(#surface-study-bevel)"><path id="inner-frame" data-text-equivalent="expanded 6px red perimeter stroke" d="M36 158 H639 V970 C639 994.853 619.301 1015 595 1015 H80 C55.699 1015 36 994.853 36 970 Z M27.000 155.000 C25.343 155.000 24.000 156.343 24.000 158.000 L24.000 970.000 C24.000 1001.492 49.181 1027.000 80.000 1027.000 L595.000 1027.000 C625.819 1027.000 651.000 1001.492 651.000 970.000 L651.000 158.000 C651.000 156.343 649.657 155.000 648.000 155.000 L27.000 155.000 Z " fill="#507EBC" stroke="none" /><path id="header" d="M24 76 C24 46.2 48.2 22 78 22 H597 C626.8 22 651 46.2 651 76 V158 H24 Z" stroke="none" /><rect id="panel-divider" x="24" y="635" width="627" height="8" stroke="none" /><path id="surface-study-unified-glaze" d="M24 76 C24 46.2 48.2 22 78 22 H597 C626.8 22 651 46.2 651 76 V970 C651 1001.492 625.819 1027 595 1027 H80 C49.181 1027 24 1001.492 24 970 Z M36 158 H639 V635 H36 Z M36 643 H639 V970 C639 994.853 619.301 1015 595 1015 H80 C55.699 1015 36 994.853 36 970 Z" fill="url(#surface-study-continuous-light)" fill-rule="evenodd" stroke="none" pointer-events="none"/></g></g>
  <g id="instant-action-cp-tag" aria-label="Editable Main Phase Action CP tag" transform="translate(24 169)">
    <defs>
      <linearGradient id="cp-badge-fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF" />
        <stop offset="1" stop-color="#D9D9D9" />
      </linearGradient>
      <linearGradient id="cp-red-fill" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#6E9CDA" />
        <stop offset="0.12" stop-color="#507EBC" />
        <stop offset="0.78" stop-color="#385377" />
        <stop offset="1" stop-color="#588BD0" />
      </linearGradient>
      <linearGradient id="cp-red-edge" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8CB6EF" stop-opacity="0.9" />
        <stop offset="0.14" stop-color="#476C9E" stop-opacity="0.72" />
        <stop offset="0.6" stop-color="#283C57" stop-opacity="0.2" />
        <stop offset="1" stop-color="#689ADD" stop-opacity="0.75" />
      </linearGradient>
      <linearGradient id="cp-label-fill" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#292929" />
        <stop offset="0.12" stop-color="#121212" />
        <stop offset="0.78" stop-color="#070707" />
        <stop offset="1" stop-color="#202020" />
      </linearGradient>
      <linearGradient id="cp-label-edge" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#777777" stop-opacity="0.9" />
        <stop offset="0.14" stop-color="#3A3A3A" stop-opacity="0.72" />
        <stop offset="0.6" stop-color="#101010" stop-opacity="0.2" />
        <stop offset="1" stop-color="#454545" stop-opacity="0.75" />
      </linearGradient>
      <filter id="cp-panel-shadow" x="-12" y="-8" width="84" height="450" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="blur" />
        <feOffset dy="1.2" result="offset" />
        <feFlood flood-color="#000000" flood-opacity="0.74" result="shade" />
        <feComposite in="shade" in2="offset" operator="in" result="shadow" />
        <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
      <filter id="cp-badge-shadow" x="0" y="5" width="60" height="115" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur" />
        <feOffset dy="1" result="offset" />
        <feFlood flood-color="#460008" flood-opacity="0.68" result="shade" />
        <feComposite in="shade" in2="offset" operator="in" result="shadow" />
        <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
