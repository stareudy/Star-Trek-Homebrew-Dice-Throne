      <g id="main-phase-clock-icon" aria-label="Main Phase M-clock icon" fill="#FFFFFF"><path d="M20 123 H39 V127 H20 Z" /><circle cx="29.5" cy="152" r="20" fill="none" stroke="#FFFFFF" stroke-width="2.4" /><path d="M29.5 129 L26.2 134.5 H32.8 Z M29.5 175 L26.2 169.5 H32.8 Z M6.5 152 L12 148.7 V155.3 Z M52.5 152 L47 148.7 V155.3 Z" /><path d="M17 164 V139 H23 L29.5 150 L36 139 H42 V164 H36 V150 L29.5 159 L23 150 V164 Z" /></g></g>
    <g id="instant-action-label" filter="url(#cp-panel-shadow)" aria-label="Main Phase Action CP tag label">
      <path d="M0.5 182.5 H42.5 V375 C42.5 379.14 39.14 382.5 35 382.5 H0.5 Z" fill="url(#cp-label-fill)" stroke="url(#cp-label-edge)" stroke-width="1.2" stroke-linejoin="round" />
      <g id="main-phase-action-label" data-text="Main Phase Action" data-font="Arial Narrow Bold" fill="#FFFFFF" transform="rotate(-90 21.5 282.5)"><text id="main-phase-action-label-text" x="21.5" y="291" text-anchor="middle" font-family="Arial Narrow" font-size="24px" font-weight="700" fill="#FFFFFF">Main Phase Action</text></g>
    </g>
    <path id="cp-tag-outer-outline" d="M0 0.5 H51.5 C55.4 0.5 58.5 3.6 58.5 7.5 V174.5 C58.5 178.4 55.4 181.5 51.5 181.5 H43 V375 C43 379.4 39.9 382.5 35.5 382.5 H0 Z" fill="none" stroke="#3A3A3A" stroke-width="1.2" stroke-linejoin="round" pointer-events="none" />
  </g>
  <g id="card-title" aria-label="Instant Action card title" transform="translate(17.69 -4) scale(0.9476 1)"><text id="card-title-text" data-text="KAL-TOH" data-font="Helvetica Compressed" x="337.5" y="124.5" text-anchor="middle" font-family="Helvetica Compressed" font-size="86px" font-weight="400" fill="#101219">KAL-TOH</text></g>
<g id="editable-rules" filter="url(#action-rules-halo)" aria-label="Editable formatted card rules" font-family="Arial Narrow, sans-serif" font-size="37.5px" font-weight="400" fill="#F7F7F7">
<text x="104.293" y="755" text-anchor="start" xml:space="preserve">Look at the top 3 cards of your deck.</text>
<text x="107.303" y="809" text-anchor="start" xml:space="preserve">Put one on the bottom of your deck</text>
<text x="132.450" y="863" text-anchor="start" xml:space="preserve">and return the others to the top</text>
<text x="254.907" y="917" text-anchor="start" xml:space="preserve">in any order.</text>
</g></svg>
